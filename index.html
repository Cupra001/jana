<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>هدية خاصة لـ جنى</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
</head>

<body>

    <!-- واجهة الترحيب -->
    <div id="welcome-overlay" class="welcome-overlay">
        <div class="welcome-box">
            <h2>هدية خاصة من أجل:</h2>
            <h1 class="target-name">جنى</h1>
            <p>❤️💫</p>
            <button id="startBtn" class="start-btn">افتح الهدية 🎁</button>
        </div>
    </div>

    <!-- العنوان المضيء -->
    <div id="flower-title" class="flower-title-container">
        <h1 class="glowing-text">روحي جنى</h1>
    </div>

    <!-- الورود المتحركة -->
    <div class="ground">
        <div class="flower-container"></div>
        <div class="flower-container"></div>
        <div class="flower-container white-flower-mode"></div>
        <div class="flower-container"></div>
        <div class="flower-container"></div>
        <div class="flower-container"></div>
        <div class="flower-container"></div>
        <div class="flower-container"></div>
        <div class="flower-container"></div>
        <div class="flower-container"></div>
    </div>

    <!-- الموسيقى -->
    <audio id="bgMusic" loop preload="auto">
        <source src="song.mp3" type="audio/mpeg">
    </audio>

    <script src="script.js"></script>
</body>

</html>
