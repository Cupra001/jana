<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glowing Flower & Butterflies Animation</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <!-- واجهة الترحيب -->
    <div id="welcome-overlay" class="welcome-overlay">
        <div class="welcome-box">
            <h2>هدية خاصة من أجل:</h2>
            <h1 class="target-name">جــنــى</h1>
            <p>❤️💫</p>
            <button id="startBtn" class="start-btn">افتح الهدية 🎁</button>
        </div>
    </div>

    <!-- حاوية المكتوب والرسالة والفراشات -->
    <div id="envelope-container" class="envelope-container">
        <div class="envelope-wrapper">
            <div class="envelope">
                <div class="flap"></div>
                <div class="pocket"></div>
                <div class="letter">
                    <div class="letter-text">
                        <h3>إلى الغالية جنى البستان 🌸</h3>
                        <p>كل الكلمات لا تصف جمال قلبك ونقاء روحك. دمتِ دائماً سراً للمسرات، وابتسامة تضيء من حولك كالفراشات المتألقة في السماء. ✨❤️</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- حاوية الفراشات التي ستطير -->
    <div id="butterflies-container"></div>

    <div id="flower-title" class="flower-title-container">
        <h1 class="glowing-text">احـــلـــى جــنــى </h1>
    </div>

    <div class="ground">
        <div class="flower-container"></div>
        <div class="flower-container"></div>
        <div class="flower-container"></div>
        <div class="flower-container"></div>
        <div class="flower-container"></div>
        <div class="flower-container"></div>
        <div class="flower-container"></div>
        <div class="flower-container"></div>
        <div class="flower-container"></div>
        <div class="flower-container"></div>
    </div>

    <audio id="bgMusic" loop preload="auto">
        <source src="song.mp3" type="audio/mpeg">
    </audio>

    <script src="./script.js"></script>
</body>

</html>
