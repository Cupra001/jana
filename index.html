<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>هدية خاصة لـ جنى</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
</head>

<body>

    <!-- مشغل يوتيوب مخفي للصوت فقط -->
    <div id="youtube-audio-player" style="display: none;"></div>

    <!-- الواجهة الأولى: كارت المفاجأة المخصص لـ جنى -->
    <div id="gift-card" class="card">
        <h2>هدية خاصة من أجل:</h2>
        <h1 class="name">جنى</h1>
        <p class="emoji">❤️🩹</p>
        <button id="open-btn">🎁 افتح الهدية</button>
    </div>

    <!-- الواجهة الثانية: الورود 3D الاحترافية -->
    <div id="flower-container" class="hidden">
        <h1 class="title-glow">روحي جنى</h1>

        <div class="flowers-wrapper">
            <!-- وردة 1 حمراء 3D (يسار) -->
            <div class="flower f1 red-flower">
                <div class="flower-head">
                    <div class="petals-wrapper">
                        <div class="petal"></div>
                        <div class="petal"></div>
                        <div class="petal"></div>
                        <div class="petal"></div>
                        <div class="petal"></div>
                        <div class="petal"></div>
                        <div class="petal"></div>
                        <div class="petal"></div>
                    </div>
                    <div class="center"></div>
                </div>
                <div class="stem">
                    <div class="leaf left"></div>
                    <div class="leaf right"></div>
                </div>
            </div>

            <!-- وردة 2 حمراء 3D (وسط يسار) -->
            <div class="flower f2 red-flower">
                <div class="flower-head">
                    <div class="petals-wrapper">
                        <div class="petal"></div>
                        <div class="petal"></div>
                        <div class="petal"></div>
                        <div class="petal"></div>
                        <div class="petal"></div>
                        <div class="petal"></div>
                        <div class="petal"></div>
                        <div class="petal"></div>
                    </div>
                    <div class="center"></div>
                </div>
                <div class="stem">
                    <div class="leaf left"></div>
                </div>
            </div>

            <!-- وردة 3 بيضاء 3D (الوسطى الرئيسية) -->
            <div class="flower f3 white-flower">
                <div class="main-head">
                    <div class="petals-wrapper">
                        <div class="petal"></div>
                        <div class="petal"></div>
                        <div class="petal"></div>
                        <div class="petal"></div>
                        <div class="petal"></div>
                        <div class="petal"></div>
                        <div class="petal"></div>
                        <div class="petal"></div>
                    </div>
                    <div class="center"></div>
                </div>
                <div class="main-stem">
                    <div class="leaf left"></div>
                    <div class="leaf right"></div>
                </div>
            </div>

            <!-- وردة 4 حمراء 3D (وسط يمين) -->
            <div class="flower f4 red-flower">
                <div class="flower-head">
                    <div class="petals-wrapper">
                        <div class="petal"></div>
                        <div class="petal"></div>
                        <div class="petal"></div>
                        <div class="petal"></div>
                        <div class="petal"></div>
                        <div class="petal"></div>
                        <div class="petal"></div>
                        <div class="petal"></div>
                    </div>
                    <div class="center"></div>
                </div>
                <div class="stem">
                    <div class="leaf right"></div>
                </div>
            </div>

            <!-- وردة 5 حمراء 3D (يمين) -->
            <div class="flower f5 red-flower">
                <div class="flower-head">
                    <div class="petals-wrapper">
                        <div class="petal"></div>
                        <div class="petal"></div>
                        <div class="petal"></div>
                        <div class="petal"></div>
                        <div class="petal"></div>
                        <div class="petal"></div>
                        <div class="petal"></div>
                        <div class="petal"></div>
                    </div>
                    <div class="center"></div>
                </div>
                <div class="stem">
                    <div class="leaf left"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- تحميل مكتبة الـ API لليوتيوب لاستدعاء الأغنية -->
    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="script.js"></script>
</body>

</html>
